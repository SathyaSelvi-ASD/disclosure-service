# ============================================================
# Application
# ============================================================
spring.application.name=disclosureapplication

# ============================================================
# MySQL - DEV
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Hikari Connection Pool
# ============================================================
spring.datasource.hikari.pool-name=disclosure-service-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:60000}

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false

# Prefer validate/update depending on your DEV deployment strategy.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ============================================================
# Actuator / Monitoring
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics

# DEV tracing - adjust based on your tracing infrastructure
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN
# ============================================================
# Application
# ============================================================
spring.application.name=disclosureapplication-test

# ============================================================
# MySQL - Test
# ============================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/disclosure_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Hikari Connection Pool
# ============================================================
spring.datasource.hikari.pool-name=disclosure-test-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Messages
# ============================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics

# ============================================================
# Tracing
# ============================================================
management.tracing.sampling.probability=0.0

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.com.vbox.disclosure=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================================
# Work Action Service Client
# ============================================================
work-action.client.base-url=${WORK_ACTION_BASE_URL:http://localhost:8081}
work-action.client.search-path=${WORK_ACTION_SEARCH_PATH:/api/v1/work-actions/search}
spring.profiles.active=local

# ============================================================
# MySQL DataSource (default fallback)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disclosure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate (default fallback)
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# ============================================================
# Work Action Service Client
# ============================================================
work-action.client.base-url=${WORK_ACTION_BASE_URL:http://localhost:8081}
work-action.client.search-path=${WORK_ACTION_SEARCH_PATH:/api/v1/work-actions/search}
